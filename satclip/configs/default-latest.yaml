# lightning.pytorch==2.6.1
seed_everything: 0
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 1
  precision: null
  logger:
  - class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: /data/susanket/sentinel/training
      name: 600k
      version: rff
      log_graph: false
      default_hp_metric: true
      prefix: ''
      sub_dir: null
      comment: ''
      purge_step: null
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: /data/susanket/sentinel/training
      name: 600k
      version: rff
      prefix: ''
      flush_logs_every_n_steps: 100
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: '{epoch}-{val_loss:.2f}'
      monitor: val_loss
      verbose: false
      save_last: true
      save_top_k: 1
      save_on_exception: false
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      min_delta: 0.0
      patience: 10
      verbose: true
      mode: min
      strict: true
      check_finite: true
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: false
      log_rank_zero_only: false
  fast_dev_run: false
  max_epochs: 1000
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 1
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  embed_dim: 64
  image_resolution: 256
  vision_layers: 4
  vision_width: 1024
  vision_patch_size: 32
  in_channels: 13
  le_type: sphericalharmonics
  pe_type: siren
  frequency_num: 16
  max_radius: 0.01
  min_radius: 1.0e-05
  legendre_polys: 40
  harmonics_calculation: analytic
  sh_embedding_dims: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  num_hidden_layers: 2
  capacity: 256
data:
  data_dir: /data/susanket/sentinel
  batch_size: 20480
  num_workers: 90
  crop_size: 256
  val_random_split_fraction: 0.1
  transform: pretrained
  mode: both
watchmodel: true
optimizer: null
lr_scheduler: null
